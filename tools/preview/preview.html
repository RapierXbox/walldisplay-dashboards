<title>Wall Display Previews</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap");

/* ---------- outer page (quiet chrome) ---------- */
:root {
  color-scheme: light;
  --page-bg: #f2f2f0;
  --page-fg: #1d1d1f;
  --page-muted: #66666b;
  --page-line: #d6d6d9;
  --page-surface: #ffffff;
  --page-accent: #0b6bcb;
  --page-danger: #c62828;
  --page-danger-bg: #fdecea;
  --bezel: #1b1b1d;
  --bezel-edge: #3a3a3e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page-bg: #161618;
    --page-fg: #e6e6e8;
    --page-muted: #9a9aa0;
    --page-line: #34343a;
    --page-surface: #202024;
    --page-accent: #5aa7f0;
    --page-danger: #ff6b60;
    --page-danger-bg: #3a1a18;
    --bezel: #050506;
    --bezel-edge: #2e2e33;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page-bg: #161618;
  --page-fg: #e6e6e8;
  --page-muted: #9a9aa0;
  --page-line: #34343a;
  --page-surface: #202024;
  --page-accent: #5aa7f0;
  --page-danger: #ff6b60;
  --page-danger-bg: #3a1a18;
  --bezel: #050506;
  --bezel-edge: #2e2e33;
}
body {
  margin: 0;
  background: var(--page-bg);
  color: var(--page-fg);
  font: 14px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-x: hidden;
}
.bar {
  position: sticky; top: 0; z-index: 20;
  background: var(--page-bg);
  border-bottom: 1px solid var(--page-line);
  padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
}
.bar h1 { font-size: 15px; font-weight: 500; margin: 0; margin-right: auto; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--page-muted); font-size: 13px; }
.controls select {
  font: inherit; color: var(--page-fg); background: var(--page-surface);
  border: 1px solid var(--page-line); border-radius: 6px; padding: 4px 6px; max-width: 70vw;
}
.controls input[type="checkbox"] { accent-color: var(--page-accent); }
.meta { padding: 8px 16px 0; margin: 0; color: var(--page-muted); font-size: 12px; }
.meta b { color: var(--page-danger); font-weight: 500; }
#stage {
  padding: 16px;
  display: flex; flex-wrap: wrap; gap: 28px 28px; align-items: flex-start;
}
.dev { margin: 0; min-width: 0; }
.dev-box { position: relative; overflow: hidden; }
.device {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  background: var(--bezel);
  border-radius: 26px;
  box-shadow: inset 0 0 0 2px var(--bezel-edge), 0 6px 18px rgba(0,0,0,.18);
}
.dev figcaption { margin-top: 8px; font-size: 12px; color: var(--page-muted); line-height: 1.4; }
.dev figcaption .name { color: var(--page-fg); font-weight: 500; font-size: 13px; }
.badge {
  display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px;
  font-size: 11px; font-weight: 700; color: var(--page-danger); background: var(--page-danger-bg);
  border: 1px solid var(--page-danger);
}
.over-rows { color: var(--page-danger); font-weight: 500; }
.empty { color: var(--page-muted); padding: 24px 0; }

/* ---------- Home Assistant emulation (inside the screen) ---------- */
.screen {
  position: absolute; overflow: hidden; border-radius: 4px;
  --primary-background-color: #fafafa;
  --card-background-color: #ffffff;
  --primary-text-color: #212121;
  --secondary-text-color: #727272;
  --divider-color: rgba(0, 0, 0, .12);
  --primary-color: #03a9f4;
  --state-icon-color: #44739e;
  --disabled-color: #bdbdbd;
  --state-inactive-color: #bdbdbd;
  --control-bg: rgba(189, 189, 189, .2);
  --warning-color: #ffa600;
  /* typography tokens (HA 2026.10 defaults); override here for the typography pass */
  /* HA tokens as redeclared by walldisplay.js (#view): fixed scale for 1-2 m reading distance */
  --ha-font-size-scale: 1.15;
  --ha-font-size-xs: 12px; --ha-font-size-s: 14px; --ha-font-size-m: 16px; --ha-font-size-l: 18px;
  --ha-font-size-xl: 22px; --ha-font-size-2xl: 26px; --ha-font-size-3xl: 32px;
  --ha-font-size-4xl: 36px; --ha-font-size-5xl: 46px;
  --wd-font-tile-name: var(--ha-font-size-m);        /* 18 px from 900 px wide, 20 px from 1200 (set per frame) */
  --wd-font-tile-state: var(--ha-font-size-s);       /* 16 px from 1200 */
  --wd-font-nav-label: 14px;
  --wd-font-markdown: 16px;
  --wd-font-heading: var(--ha-font-size-l);
  --wd-font-clock-small: 40px;
  --wd-font-clock-medium: calc(48px * var(--ha-font-size-scale));
  --wd-font-clock-large: calc(64px * var(--ha-font-size-scale));   /* 88 px from 1200 */
  --wd-font-clock-ampm-small: var(--ha-font-size-xs);
  --wd-font-clock-ampm-medium: var(--ha-font-size-l);
  --wd-font-clock-ampm-large: var(--ha-font-size-2xl);
  --wd-font-clock-date-small: var(--ha-font-size-s);
  --wd-font-clock-date-medium: var(--ha-font-size-l);
  --wd-font-clock-date-large: var(--ha-font-size-2xl);
  --wd-font-thermostat-title: var(--ha-font-size-l);
  --wd-font-thermostat-target: 57px;
  --wd-font-thermostat-info: var(--ha-font-size-l);
  --wd-font-media-base: 16px;
  --wd-font-media-title: 1.2em;
  --wd-font-forecast-temp: var(--ha-font-size-l);
  --wd-font-forecast-label: var(--ha-font-size-s);
  --wd-font-feature-value: var(--ha-font-size-m);
  background: var(--primary-background-color);
  color: var(--primary-text-color);
  font-family: Roboto, Noto, "Noto Sans", sans-serif;
  font-size: 14px; line-height: 1.43;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
.screen.dark {
  --primary-background-color: #111111;
  --card-background-color: #1c1c1c;
  --primary-text-color: #e1e1e1;
  --secondary-text-color: #9b9b9b;
  --divider-color: rgba(225, 225, 225, .12);
  --disabled-color: #6f6f6f;
  --state-inactive-color: #6f6f6f;
  --control-bg: rgba(111, 111, 111, .2);
}
.screen svg { fill: currentColor; display: block; }
.hv-sections {
  position: absolute; left: 0; right: 0; margin: 0 auto;
  display: grid; align-items: start;
  grid-template-columns: repeat(var(--n), minmax(0, 1fr));
}
.hv-section { min-width: 0; }
.sgrid {
  display: grid; grid-auto-flow: row dense; gap: 8px;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
}
.cell { position: relative; min-width: 0; }
.cell > .card, .cell > .ha-card { height: 100%; }
.ha-card {
  background: var(--card-background-color);
  border: 1px solid var(--divider-color);
  border-radius: 12px;
  box-sizing: border-box;
  position: relative; overflow: hidden;
  color: var(--primary-text-color);
}
.ha-card.bare { background: none; border-color: transparent; }
.tap { cursor: pointer; }
.pressed { filter: brightness(.92); }

/* tile */
.tile { display: flex; flex-direction: column; --feature-color: var(--tile-color); }
.tile-content {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; flex: 1 1 auto; min-height: 0; min-width: 0; box-sizing: border-box;
}
.tile:not(.vertical) .tile-content { padding: 0 10px; min-height: 54px; } /* ha-tile-container: min-height 56 incl. the 1 px border */
.tile.vertical .tile-content { flex-direction: column; justify-content: center; text-align: center; gap: 10px; padding: 10px 8px; }
/* ha-tile-container .vertical.fixed-info-height: every tile in a grid reserves the same info height */
.cell > .tile.vertical .tile-content { gap: 2px; }
.cell > .tile.vertical .tile-info { min-height: 48px; justify-content: center; }
.cell > .tile.vertical .tile-name { line-height: 32px; }
.tile-icon {
  position: relative; flex: none; width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: var(--tile-color);
}
.tile-icon::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--tile-color); opacity: .2; display: none; }
.tile-icon.bg::before { display: block; }
.tile-icon svg { position: relative; width: 24px; height: 24px; }
.tile-info { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.tile.vertical .tile-info { flex: none; width: 100%; }
.tile-name, .tile-state { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-name { font-size: var(--wd-font-tile-name); font-weight: 500; line-height: 1.5; letter-spacing: .1px; }
.tile-state { font-size: var(--wd-font-tile-state); font-weight: 400; line-height: 1.2; letter-spacing: .4px; color: var(--primary-text-color); }
.tile-features { display: flex; flex-direction: column; gap: 12px; padding: 0 12px 12px; }
.tile.inline .tile-content > .tile-features { padding: 0; flex: none; width: calc(50% - 12px); min-width: 0; }
.tile.inline .tile-content > .tile-info { flex: 1 1 0; }
.tile-features.cols2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
.tile-icon.pic { background-size: cover; background-position: center; color: #fff; font-size: 14px; font-weight: 500; overflow: hidden; }
.tile-icon.pic::before { display: none; }
.tile.summary-alert::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--tile-color); opacity: .3; pointer-events: none; }
.tile.inline .tile-content > .tile-info { flex: 1 1 0; }
.tile.warn .tile-icon { --tile-color: var(--warning-color); }
.feat { height: 42px; display: flex; gap: 12px; flex: none; }
.tile.inline .inline-slot .feat { height: 36px; gap: 8px; }
.cell > .tile.inline.has-below .inline-slot .feat { height: 42px; }
.ctl {
  flex: 1 1 0; min-width: 0; border-radius: 12px; background: var(--control-bg);
  display: flex; align-items: center; justify-content: center; color: var(--primary-text-color);
}
.ctl svg { width: 20px; height: 20px; }
.ctl.val { flex: 2 1 0; font-size: var(--wd-font-feature-value); font-weight: 500; background: none; }
.ctl.val small { font-size: 12px; font-weight: 400; margin-left: 2px; color: var(--secondary-text-color); }
.slider { position: relative; flex: 1 1 auto; border-radius: 12px; overflow: hidden; }
.slider::before { content: ""; position: absolute; inset: 0; background: var(--tile-color); opacity: .2; }
.slider-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--tile-color); }
.slider-handle { position: absolute; top: 25%; bottom: 25%; width: 4px; border-radius: 2px; background: #fff; opacity: .9; }
.feat.unknown { border: 1px dashed var(--secondary-text-color); border-radius: 12px; align-items: center; justify-content: center; font: 11px/1 ui-monospace, monospace; color: var(--secondary-text-color); }

/* clock */
.clock { height: 100%; box-sizing: border-box; }
.clock-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; height: 100%; padding: 6px 8px; row-gap: 6px; }
.clock-wrap.size-medium, .clock-wrap.size-large { padding: 16px; row-gap: 12px; }
.clock-title { font-size: 14px; line-height: 1.2; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock-wrap.size-medium .clock-title { font-size: 16px; }
.clock-wrap.size-large .clock-title { font-size: 24px; }
.clock-box { width: 100%; display: flex; flex-direction: column; align-items: center; }
.clock-time { display: grid; align-items: center; grid-template-areas: "hour minute second" "hour minute am-pm";
  font-size: var(--wd-font-clock-small); font-weight: 500; line-height: .8; direction: ltr; }
.clock-time.size-medium { font-size: var(--wd-font-clock-medium); }
.clock-time.size-large { font-size: var(--wd-font-clock-large); }
.clock-time .hour { grid-area: hour; }
.clock-time .hour::after { content: ":"; margin: 0 2px; }
.clock-time .minute { grid-area: minute; }
.clock-time .second, .clock-time .am-pm { font-size: var(--wd-font-clock-ampm-small); margin-left: 4px; line-height: .9; }
.clock-time .second { grid-area: second; opacity: .4; }
.clock-time .am-pm { grid-area: am-pm; opacity: .6; }
.clock-time.size-medium .second, .clock-time.size-medium .am-pm { font-size: var(--wd-font-clock-ampm-medium); margin-left: 6px; }
.clock-time.size-large .second, .clock-time.size-large .am-pm { font-size: var(--wd-font-clock-ampm-large); margin-left: 8px; }
.clock-date { margin-top: 4px; width: 100%; text-align: center; opacity: .8; font-size: var(--wd-font-clock-date-small); line-height: 1.1; white-space: nowrap; overflow: hidden; }
.clock-date.size-medium { font-size: var(--wd-font-clock-date-medium); }
.clock-date.size-large { font-size: var(--wd-font-clock-date-large); }

/* heading */
.heading { display: flex; align-items: flex-end; gap: 8px; padding: 8px 4px 4px; min-height: 24px; color: var(--primary-text-color); }
.heading svg { width: 18px; height: 18px; flex: none; margin-bottom: 3px; color: var(--secondary-text-color); }
.heading .t { font-size: var(--wd-font-heading); font-weight: 400; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heading.subtitle .t { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--secondary-text-color); }

/* markdown */
.md { padding: 16px; font-size: var(--wd-font-markdown); line-height: 1.5; overflow: hidden; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .5em; }
.md h1 { font-size: 24px; font-weight: 400; margin: .2em 0 .4em; line-height: 1.2; }
.md h2 { font-size: 20px; font-weight: 400; margin: .2em 0 .4em; line-height: 1.25; }
.md h3, .md h4, .md h5, .md h6 { font-size: 16px; font-weight: 500; margin: .2em 0 .4em; }
.md ul { margin: 0 0 .5em; padding-left: 20px; }
.md code { font-family: ui-monospace, monospace; font-size: 12px; background: var(--control-bg); padding: 1px 4px; border-radius: 4px; }
.md .md-icon { display: inline-block; vertical-align: -5px; }
.md .md-icon svg { width: 24px; height: 24px; }
.md .tpl { color: var(--secondary-text-color); }
.md-title { padding: 16px 16px 0; font-size: 20px; }

/* stacks, grid card */
.vstack { display: flex; flex-direction: column; gap: 8px; }
.vstack > * { flex: none; height: auto; }
.hstack { display: flex; gap: 8px; align-items: stretch; }
.hstack > * { height: auto; }
.hstack > * { flex: 1 1 0; min-width: 0; }
.gridcard { display: grid; gap: 8px; grid-template-columns: repeat(var(--gc), minmax(0, 1fr)); }
.gridcard.square > * { aspect-ratio: 1 / 1; }
/* a grid card fills the height it is given (cell or stretched grid row); its auto rows share the extra */
.cell > .card.gridwrap, .card-host > .card.gridwrap { display: flex; flex-direction: column; }
.card.gridwrap > .gridcard { flex: 1 1 auto; min-height: 0; }
.card.gridwrap > .gridcard:not(.square) > .card-host > * { height: 100%; box-sizing: border-box; }
.gridcard > .card-host > * { height: 100%; }
.card-title { font-size: 16px; padding: 4px 4px 8px; }

/* placeholder */
.placeholder {
  border: 2px dashed var(--secondary-text-color); border-radius: 12px; box-sizing: border-box;
  height: 100%; min-height: 56px; padding: 6px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  color: var(--secondary-text-color); font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; opacity: .85;
}
.placeholder b { color: var(--primary-text-color); font-weight: 500; }

/* custom:wall-display-nav (mirrors NAV_CSS in frontend/walldisplay.js) */
.wd-nav {
  box-sizing: border-box; display: flex; height: 56px; max-width: 100%; margin: 0 auto; padding: 4px;
  border-radius: 28px; background: var(--card-background-color);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .20), 0 6px 20px rgba(0, 0, 0, .18);
  border: 1px solid rgba(127, 127, 127, .25);
}
.wd-nav-item {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 0 4px; border-radius: 24px; color: var(--secondary-text-color); cursor: pointer;
}
.wd-nav-item svg { width: 24px; height: 24px; color: var(--secondary-text-color); flex: none; }
.wd-nav-item .nav-icon { position: relative; display: flex; }
.wd-nav-item.live svg { color: var(--state-media_player-active-color, #03a9f4); }
.wd-nav-item.heat svg { color: var(--state-climate-heat-color, #ff6f22); }
.wd-nav-item.cool svg { color: var(--state-climate-cool-color, #2196f3); }
.wd-nav-item .nav-label { max-width: 100%; font-size: var(--wd-font-nav-label); line-height: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wd-nav-item.active { background: color-mix(in srgb, var(--primary-color) 20%, transparent); color: var(--primary-color); }
.wd-nav-item.active .nav-label { font-weight: 700; }
.wd-nav-item.active svg, .wd-nav-item.active.live svg, .wd-nav-item.active.heat svg, .wd-nav-item.active.cool svg { color: var(--primary-color); }

/* thermostat card (hui-thermostat-card + ha-state-control-climate-temperature) */
.thermo { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100%; }
.th-title {
  width: 100%; font-size: var(--wd-font-thermostat-title); line-height: 24px; padding: 8px 30px; margin: 0; text-align: center;
  box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none;
}
.th-more { position: absolute; top: 0; right: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--secondary-text-color); }
.th-more svg { width: 24px; height: 24px; }
.th-container { flex: 1 1 0; min-height: 0; width: 100%; container-type: size; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.th-control { width: min(100cqw, 100cqh, 336px); height: min(100cqw, 100cqh, 336px); padding: 8px; box-sizing: border-box; flex: none; }
.th-dial { position: relative; width: 100%; height: 100%; container-type: inline-size; }
.th-dial::after {
  content: ""; position: absolute; inset: -10%; pointer-events: none; opacity: .15;
  background: radial-gradient(50% 50% at 50% 50%, var(--action-color, transparent) 0%, transparent 100%);
}
.th-dial svg { width: 100%; height: 100%; overflow: visible; display: block; }
.th-dial .bg { fill: none; stroke: var(--disabled-color); opacity: .3; stroke-linecap: round; stroke-width: 24px; }
.th-dial .arc { fill: none; stroke-linecap: round; stroke-width: 24px; }
.th-dial .arc-clear { stroke: var(--card-background-color); }
.th-dial .arc-colored { stroke: var(--state-color); opacity: .5; }
.th-dial .arc-active { stroke: var(--state-color); }
.th-dial .cur { fill: none; stroke-linecap: round; stroke-width: 8px; stroke: var(--primary-text-color); opacity: .5; }
.th-dial .cur.on-arc { stroke: var(--card-background-color); }
.th-dial .tgt-border { fill: none; stroke-linecap: round; stroke-width: 24px; stroke: var(--state-color); }
.th-dial .tgt { fill: none; stroke-linecap: round; stroke-width: 18px; stroke: #fff; }
.th-dial.inactive .arc, .th-dial.inactive .cur.on-arc { opacity: 0; }
.th-info {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: var(--wd-font-thermostat-info); line-height: 1.5; letter-spacing: .1px; gap: 8px; pointer-events: none;
}
.th-info p { margin: 0; }
.th-label { width: 60%; font-weight: 500; text-align: center; color: var(--action-color, inherit); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.5em; }
.th-big { display: flex; font-size: var(--wd-font-thermostat-target); line-height: 1.12; letter-spacing: -.25px; }
.th-big .addon { display: flex; flex-direction: column-reverse; padding: 4px 0; }
.th-big .dec { font-size: .42em; line-height: 1.33; min-height: 1.33em; }
.th-big .unit { font-size: .33em; line-height: 1.2; }
.th-sec { display: flex; align-items: center; gap: 2px; }
.th-sec svg { width: 16px; height: 16px; }
.th-buttons { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 24px; }
.th-btn {
  width: 48px; height: 48px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--outline-color, rgba(127, 127, 127, .5)); color: var(--primary-text-color); cursor: pointer;
}
.th-btn svg { width: 24px; height: 24px; }
@container (max-width: 249px) {
  .th-big { font-size: 44px; }
  .th-info { margin-top: 12px; gap: 6px; }
  .th-buttons { display: none; }
}
@container (max-width: 189px) {
  .th-big { font-size: var(--ha-font-size-4xl); }
  .th-info { font-size: var(--ha-font-size-m); gap: 2px; }
  .th-sec svg { width: 14px; height: 14px; }
}
@container (max-width: 129px) { .th-label { display: none; } .th-info { font-size: 16px; } }
.th-features { width: 100%; flex: none; padding: 0 12px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
.csel { display: flex; gap: 0; padding: 0; border-radius: 12px; overflow: hidden; position: relative; flex: 1; box-sizing: border-box; height: 42px; }
.csel::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--disabled-color); opacity: .2; }
.csel-opt { position: relative; flex: 1 1 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--primary-text-color); cursor: pointer; }
.csel-opt svg { width: 20px; height: 20px; }
.csel-opt.sel { background: var(--feature-color, var(--primary-color)); color: #fff; }
.cmenu { position: relative; flex: 1; height: 42px; border-radius: 12px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; box-sizing: border-box; cursor: pointer; }
.cmenu::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--disabled-color); opacity: .2; }
.cmenu > * { position: relative; }
.cmenu svg { width: 20px; height: 20px; flex: none; }
.cmenu .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.cmenu .lbl { font-size: 11px; color: var(--secondary-text-color); }
.cmenu .val { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* media-control card (hui-media-control-card) */
.mc { height: 100%; container-type: inline-size; color: #fff; font-size: var(--wd-font-media-base); }
.mc-bg { position: absolute; inset: 0; display: flex; overflow: hidden; }
.mc-bg.off { filter: grayscale(1); }
.mc-color { width: 100%; background: var(--primary-color); }
.mc-art { position: absolute; top: 0; right: 0; height: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }
.mc-art.noimg { aspect-ratio: auto; width: 50%; }
.mc-art svg { max-width: 120px; max-height: 120px; }
.mc-art svg { width: 40%; height: 40%; color: rgba(255, 255, 255, .35); }
.mc-fade { position: absolute; top: 0; height: 100%; right: 0; aspect-ratio: 1 / 1; background: linear-gradient(to right, var(--mc-bg), transparent); }
.mc-player { position: relative; padding: 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
.mc-top { display: flex; align-items: center; gap: 8px; padding-right: 40px; min-width: 0; }
.mc-top svg { width: 24px; height: 24px; flex: none; }
.mc-top div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-more { position: absolute; top: 4px; right: 4px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
.mc-more svg { width: 24px; height: 24px; }
.mc-tc { padding-top: 16px; }
.mc-info { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 30%; }
.mc-title { font-size: var(--wd-font-media-title); margin: 0 0 4px; overflow: hidden; text-overflow: ellipsis; }
.mc-controls { padding: 8px 8px 8px 0; margin-left: -12px; display: flex; align-items: center; }
.mc.no-image .mc-controls { padding: 0; }
.mc.no-progress:not(.no-controls) .mc-player { padding-bottom: 0; }
.mc-top { min-height: 24px; }
.mc-title { line-height: 1.43; }
.mc-controls .start { flex-grow: 1; display: flex; align-items: center; }
.mc-controls .end { display: flex; align-items: center; }
.mc-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; }
.mc-btn svg { width: 30px; height: 30px; }
.mc-btn.main { width: 56px; height: 56px; }
.mc-btn.main svg { width: 40px; height: 40px; }
.mc-btn.small svg { width: 24px; height: 24px; }
.mc-progress { height: 8px; border-radius: 4px; background: rgba(200, 200, 200, .5); overflow: hidden; }
.mc-progress i { display: block; height: 100%; background: #fff; border-radius: 4px; }
.mc.no-progress .mc-controls { padding-bottom: 0; }
@container (max-width: 349px) {
  .mc-progress { display: none; }
  .mc-controls { padding-bottom: 0; }
  .mc-btn { width: 40px; height: 40px; }
  .mc-btn svg { width: 28px; height: 28px; }
  .mc-btn.main { width: 50px; height: 50px; }
  .mc-btn.main svg { width: 36px; height: 36px; }
}
@container (max-width: 299px) { .mc:not(.keep-controls) .mc-controls { display: none; } }

/* area card */
.area-card.picture { display: flex; flex-direction: column; justify-content: space-between; }
.area-head { flex: 1; position: relative; overflow: hidden; border-radius: 12px 12px 0 0; min-height: 0; }
.area-pic { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--tile-color); position: relative; }
.area-pic::before { content: ""; position: absolute; inset: 0; background: var(--tile-color); opacity: .12; }
.area-pic svg { width: 48px; height: 48px; position: relative; }
.area-head + .tile-content { flex: none; }
.area-alerts { position: absolute; top: 0; left: 0; display: flex; gap: 8px; padding: 8px; }
.area-alerts span { width: 24px; height: 24px; padding: 2px; box-sizing: border-box; border-radius: 12px; background: #ff9800; color: #fff; display: flex; align-items: center; justify-content: center; }
.area-alerts svg { width: 16px; height: 16px; }
.tile-badge { position: absolute; top: -3px; right: -3px; width: 16px; height: 16px; border-radius: 50%; background: #ff9800; color: #fff; display: flex; align-items: center; justify-content: center; }
.tile-badge svg { width: 12px; height: 12px; }
.area-ctl .ctl { position: relative; background: none; }
.area-ctl .ctl::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--disabled-color); opacity: .2; }
.area-ctl .ctl.active::before { background: var(--active-color); }
.area-ctl .ctl.active { color: var(--active-color); }
.area-ctl .ctl svg { position: relative; }
.inline-slot .area-ctl { justify-content: flex-end; }
.inline-slot .area-ctl .ctl { flex: none; width: 48px; }

/* weather-forecast card */
.wfc { height: 100%; padding: 16px 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; }
.wfc-cur { display: flex; align-items: center; padding: 0 16px; gap: 8px; }
.wfc-icon svg { width: 64px; height: 64px; }
.wfc-ns { flex: 1; min-width: 0; }
.wfc-state { font-size: var(--ha-font-size-xl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wfc-name { font-size: var(--ha-font-size-m); color: var(--secondary-text-color); }
.wfc-temp { font-size: 28px; line-height: 1.2; }
.wfc-temp span { font-size: 24px; }
.wfc-cur + .wfc-row { padding-top: 16px; }
.wfc-row { display: flex; justify-content: space-around; padding: 0 16px; overflow: hidden; }
.wfc.short .wfc-ficon { padding: 4px 0; }
.wfc.short .wfc-ficon svg { width: 32px; height: 32px; }
.wfc.short .wfc-state, .wfc.short .wfc-temp { font-size: 24px; }
.wfc.short .wfc-icon svg { width: 48px; height: 48px; }
.wfc-dayh { min-height: 16px; font-size: 12px; font-weight: 700; line-height: 1; color: var(--secondary-text-color); white-space: nowrap; }
.wfc-item { display: flex; flex-direction: column; align-items: center; min-width: 48px; padding: 0 8px; gap: 4px; }
.wfc-lbl { font-size: var(--wd-font-forecast-label); line-height: 1; color: var(--secondary-text-color); }
.wfc-ficon { padding: 6px 0; display: flex; justify-content: center; }
.wfc-ficon svg { width: 40px; height: 40px; }
.wfc-t { font-size: var(--wd-font-forecast-temp); line-height: 1; }
.wfc-t.low { color: var(--secondary-text-color); }

/* footer */
.hv-footer { position: absolute; display: flex; align-items: center; z-index: 2; }
.hv-footer-inner { width: 100%; margin: 0 auto; }

/* overflow and grid overlays */
.cell.over { z-index: 6; }
.cell.over::after {
  content: ""; position: absolute; inset: -2px; border-radius: 13px; pointer-events: none;
  border: 3px solid #e53935;
  background: repeating-linear-gradient(45deg, rgba(229, 57, 53, .28) 0 6px, transparent 6px 12px);
}
.below {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; pointer-events: none;

}
.ovl { position: absolute; pointer-events: none; z-index: 8; }
.ovl-sec {
  display: grid; gap: 8px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  background: repeating-linear-gradient(to bottom, transparent 0 var(--wd-row, 56px), rgba(255, 64, 129, .22) var(--wd-row, 56px) calc(var(--wd-row, 56px) + 8px));

.ovl-sec > i { background: rgba(3, 169, 244, .06); box-shadow: inset 1px 0 rgba(3, 169, 244, .45), inset -1px 0 rgba(3, 169, 244, .45); }
.ovl-col { outline: 1px dashed rgba(156, 39, 176, .75); }
.ovl-foot { background: rgba(255, 152, 0, .16); border-top: 2px solid rgba(229, 57, 53, .9); }
.ovl-foot span, .ovl-col span {
  position: absolute; left: 4px; top: 2px; font: 500 10px/14px Roboto, sans-serif; color: #c62828;
  background: rgba(255, 255, 255, .85); padding: 0 4px; border-radius: 3px;
}
.ovl-col span { color: #7b1fa2; top: auto; bottom: 2px; }

      const t = Number(a.temperature);
      const lo = Number(a.min_temp ?? 7), hi = Number(a.max_temp ?? 35);
      const set = (d) => { if (Number.isFinite(t)) setState(eid, null, { temperature: Math.min(hi, Math.max(lo, Math.round((t + d) / step) * step)) }); };
      n.append(ctlButton("mdi:minus", () => set(-step)));
      n.append(el("div", "ctl val", Number.isFinite(t) ? `${esc(num(t))}<small>${esc(unit)}</small>` : "—"));
      n.append(ctlButton("mdi:plus", () => set(step)));
      return n;
    }
    if (type === "media-player-playback") {
      const n = el("div", "feat");
      const playing = st.state === "playing";
      const controls = Array.isArray(ft.controls) && ft.controls.length
        ? ft.controls : ["media_previous_track", "media_play_pause", "media_next_track"];
      for (const c of controls) {
        if (c === "media_play_pause" || c === "media_play" || c === "media_pause") {
          n.append(ctlButton(playing ? "mdi:pause" : "mdi:play", () => setState(eid, playing ? "paused" : "playing")));
        } else if (c === "turn_on" || c === "turn_off") {
          n.append(ctlButton("mdi:power", () => setState(eid, st.state === "off" ? "idle" : "off")));
        } else {
          const icon = { media_previous_track: "mdi:skip-previous", media_next_track: "mdi:skip-next", media_stop: "mdi:stop",
            volume_mute: "mdi:volume-off", shuffle_set: "mdi:shuffle", repeat_set: "mdi:repeat" }[c] || "mdi:help-circle-outline";
          n.append(ctlButton(icon, () => {}));
        }
      }
      return n;
    }
    if (type === "media-player-volume-slider") {
      const n = el("div", "feat");
      const s = el("div", "slider tap");
      const v = Math.max(0, Math.min(1, Number(a.volume_level) || 0));
      const fill = el("div", "slider-fill"); fill.style.width = `${v * 100}%`;
      const hd = el("div", "slider-handle"); hd.style.left = `max(4px, calc(${v * 100}% - 10px))`;
      s.append(fill, hd);
      s._tap = (e) => {
        const r = s.getBoundingClientRect();
        setState(eid, null, { volume_level: Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 100) / 100 });
      };
      n.append(s);
      return n;
    }
    return el("div", "feat unknown", esc(type || "feature"));
  }

  function actionOf(card) {
    if (card.tap_action) return card.tap_action;
    if (card.navigation_path) return { action: "navigate", navigation_path: card.navigation_path };
    if (card.perform_action || card.action) return { action: "perform-action", perform_action: card.perform_action || card.action, target: card.target };
    return {};
  }

  function shortcutCard(card, f) {
    const eid = card.entity;
    const st = eid ? states[eid] : null;
    const n = el("div", "ha-card tile shortcut tap");
    if (card.vertical) n.classList.add("vertical");
    let color = card.color ? resolveColor(card.color) : "var(--primary-color)";
    if (card.color === "state" && eid) color = stateColor(eid, st);
    n.style.setProperty("--tile-color", color);
    const icon = card.icon || (st && st.attributes && st.attributes.icon) || (eid ? defaultIcon(eid, st) : "mdi:gesture-tap");
    const label = card.name ?? card.label ?? card.title ?? (st && st.attributes && st.attributes.friendly_name) ?? "";
    const content = el("div", "tile-content");
    if (card.show_icon !== false) content.append(el("div", "tile-icon", ico(icon)));
    const info = el("div", "tile-info");
    if (label !== "" && card.show_name !== false) info.append(el("div", "tile-name", esc(label)));
    if (card.description) info.append(el("div", "tile-state", esc(renderTemplate(card.description))));
    content.append(info);
    n.append(content);
    n._tap = () => {
      const ta = actionOf(card);
      if (ta.action === "navigate") return navigate(f, ta.navigation_path);
      const svc = String(ta.perform_action || ta.service || "");
      const target = (ta.target && ta.target.entity_id) || (ta.data && ta.data.entity_id) || eid;
      const targets = Array.isArray(target) ? target : target ? [target] : [];
      flash(n);
      if (/\.(turn_on|turn_off|toggle)$/.test(svc) && targets.length) {
        targets.forEach((t) => { if (states[t]) states[t].state = /scene|script/.test(domainOf(t)) ? new Date().toISOString() : (svc.endsWith("turn_off") ? "off" : svc.endsWith("turn_on") ? "on" : (states[t].state === "on" ? "off" : "on")); });
        setTimeout(renderAll, 230);
      } else if (ta.action === "toggle" && eid) toggleEntity(eid);
    };
    return n;
  }

  /* clock date_format tokens such as ["weekday-short", "day-numeric", "month-short"], joined with spaces */
  function clockDate(tokens) {
    if (!Array.isArray(tokens) || !tokens.length) return "";
    const d = new Date();
    const parts = [];
    for (const t of tokens) {
      const [k, v] = String(t).split("-");
      const style = { short: "short", long: "long", narrow: "narrow", numeric: "numeric", "2digit": "2-digit" }[v] || (v === "2" ? "2-digit" : "numeric");
      const opt = { weekday: { weekday: style }, day: { day: style }, month: { month: style }, year: { year: style } }[k];
      if (!opt) continue;
      try { parts.push(new Intl.DateTimeFormat(LANG === "de" ? "de-DE" : "en-GB", opt).format(d)); } catch (e) { /* skip */ }
    }
    return parts.join(" ");
  }

  function clockCard(card) {
    const size = ["small", "medium", "large"].includes(card.clock_size) ? card.clock_size : "small";
    const n = el("div", "ha-card clock" + (card.no_background ? " bare" : ""));
    const wrap = el("div", `clock-wrap size-${size}`);
    if (card.title) wrap.append(el("div", "clock-title", esc(card.title)));
    const twelve = card.time_format === "12" || (card.time_format !== "24" && LANG === "en");   // en locale uses 12 h
    const t = el("div", `clock-time size-${size}`);
    const fmt = () => {
      const d = new Date();
      let h = d.getHours();
      const ampm = twelve ? (h < 12 ? "AM" : "PM") : "";
      if (twelve) h = h % 12 || 12;
      let html = `<span class="hour">${twelve ? h : String(h).padStart(2, "0")}</span><span class="minute">${String(d.getMinutes()).padStart(2, "0")}</span>`;
      if (card.show_seconds) html += `<span class="second">${String(d.getSeconds()).padStart(2, "0")}</span>`;
      if (ampm) html += `<span class="am-pm">${ampm}</span>`;
      return html;
    };
    t.innerHTML = fmt();
    t._fmt = fmt;
    const box = el("div", "clock-box");
    box.append(t);
    const df = clockDate(card.date_format);
    if (df) box.append(el("div", `clock-date size-${size}`, esc(df)));
    wrap.append(box);
    n.append(wrap);
    return n;
  }

  function headingCard(card, f) {
    const style = card.heading_style || "title";
    const n = el("div", `card heading ${style}`);
    if (card.icon) n.insertAdjacentHTML("beforeend", ico(card.icon));
    n.append(el("div", "t", esc(renderTemplate(card.heading ?? ""))));
    if (card.tap_action && card.tap_action.action === "navigate") { n.classList.add("tap"); n._tap = () => navigate(f, card.tap_action.navigation_path); }
    return n;
  }

  function markdownCard(card) {
    const n = el("div", "ha-card markdown" + (card.text_only ? " bare" : ""));
    if (card.title) n.append(el("div", "md-title", esc(card.title)));
    n.append(el("div", "md", markdown(card.content)));
    return n;
  }

  function stackCard(card, f, horizontal) {
    const n = el("div", `card ${horizontal ? "hstack" : "vstack"}`);
    if (card.title) n.append(el("div", "card-title", esc(card.title)));
    const box = horizontal ? n : n;
    for (const c of card.cards || []) if (isVisible(c, f)) box.append(renderCard(c, f, { natural: true }));
    return n;
  }

  function gridCard(card, f) {
    const cards = card.cards || [];
    const cols = Number(card.columns) || Math.min(cards.length || 1, 3);
    const wrap = el("div", "card gridwrap");
    if (card.title) wrap.append(el("div", "card-title", esc(card.title)));
    const g = el("div", "gridcard" + (card.square !== false ? " square" : ""));
    g.style.setProperty("--gc", cols);
    for (const c of cards) {
      if (!isVisible(c, f)) continue;
      const host = el("div", "card-host");
      host.dataset.type = c.type || "";
      host.append(renderCard(c, f, { natural: true }));
      g.append(host);
    }
    wrap.append(g);
    return wrap;
  }

  /* ---------- custom:wall-display-nav ---------- */
  function navCard(card, f) {
    const items = Array.isArray(card.items) ? card.items : [];
    const views = (f.p.dashboard && f.p.dashboard.views) || [];
    const cur = (views[f.viewIdx] && views[f.viewIdx].path) || "home";
    const pill = el("nav", "wd-nav");
    pill.style.width = `${items.length * 76 + 8}px`;
    for (const it of items) {
      const st = it.entity ? states[it.entity] : null;
      const dom = domainOf(it.entity);
      let label = it.label || "";
      const room = it.temperature_entity ? states[it.temperature_entity] : null;
      if (room) {   // a room temperature sensor chosen in the options (walldisplay.js)
        if (room.state !== "" && Number.isFinite(Number(room.state))) label = `${num(room.state)}°`;
      } else if (st && dom === "climate" && st.attributes && st.attributes.current_temperature != null && Number.isFinite(Number(st.attributes.current_temperature))) {
        label = `${num(st.attributes.current_temperature)}°`;
      }
      const live = !!st && dom === "media_player" && st.state === "playing";
      let climateCls = "";
      if (st && dom === "climate") {
        const a = st.attributes || {};
        if (a.hvac_action === "heating") climateCls = " heat";
        else if (a.hvac_action === "cooling") climateCls = " cool";
        else if (a.hvac_action == null && st.state === "heat" && Number(a.current_temperature) < Number(a.temperature)) climateCls = " heat";
        else if (a.hvac_action == null && st.state === "cool" && Number(a.current_temperature) > Number(a.temperature)) climateCls = " cool";
      }
      const b = el("div", "wd-nav-item" + (String(it.path || "") === cur ? " active" : "") + (live ? " live" : "") + climateCls,
        `<span class="nav-icon">${ico(live ? "mdi:speaker-play" : it.icon || "mdi:circle-medium")}</span><span class="nav-label">${esc(label)}</span>`);
      b._tap = () => navigate(f, it.path);
      pill.append(b);
    }
    return pill;
  }

  /* ---------- thermostat ---------- */
  const SLIDER_MODES = { auto: "full", cool: "end", dry: "full", fan_only: "full", heat: "start", heat_cool: "full", off: "full" };
  const HVAC_ICONS = { off: "mdi:power", heat: "mdi:fire", cool: "mdi:snowflake", heat_cool: "mdi:sun-snowflake-variant",
    auto: "mdi:thermostat-auto", dry: "mdi:water-percent", fan_only: "mdi:fan" };
  const HVAC_ORDER = ["auto", "heat_cool", "heat", "cool", "dry", "fan_only", "off"];
  const ACTION_TO_MODE = { heating: "heat", preheating: "heat", defrosting: "heat", cooling: "cool", drying: "dry", fan: "fan_only" };
  const R = 145, TRACK = (R * 2 * Math.PI * 270) / 360;
  const ARC = `M ${R} 0 A ${R} ${R} 0 1 1 0 ${-R}`;   // 0..270 degrees, clockwise

  function thermostatCard(card, f) {
    const eid = card.entity, st = states[eid];
    if (!st) return tileCard(card, f);
    const a = st.attributes || {};
    const mode = st.state;
    const active = mode !== "off" && mode !== "unavailable";
    const stateColor = active ? (CLIMATE_COLOR[mode] || "#ff6f22") : "var(--disabled-color)";
    const action = a.hvac_action;
    const actionColor = action && action !== "idle" && action !== "off" && active ? CLIMATE_COLOR[ACTION_TO_MODE[action]] : null;
    const min = Number(a.min_temp ?? 7), max = Number(a.max_temp ?? 35);
    const unit = a.temperature_unit || "°C";
    const step = Number(a.target_temp_step) || (unit === "°F" ? 1 : 0.5);
    const target = a.temperature != null ? Number(a.temperature) : null;
    const current = a.current_temperature != null ? Number(a.current_temperature) : null;
    const pctOf = (v) => Math.max(0, Math.min(1, (v - min) / (max - min || 1)));
    const dash = (p1, p2) => `stroke-dasharray="${Math.max((p2 - p1) * TRACK, 0)} ${TRACK}" stroke-dashoffset="${-(p1 * TRACK - 0.5)}"`;
    const dot = (p) => `stroke-dasharray="0 ${TRACK}" stroke-dashoffset="${-(p * TRACK)}"`;

    const heatCool = (a.hvac_modes || []).filter((m) => ["heat", "cool", "heat_cool"].includes(m));
    const sliderMode = SLIDER_MODES[heatCool.length === 1 && ["off", "auto"].includes(mode) ? heatCool[0] : mode] || "full";
    let g = `<path class="bg" d="${ARC}"/>`;
    if (current != null) g += `<path class="cur" d="${ARC}" ${dot(pctOf(current))}/>`;
    if (target != null) {
      const t = pctOf(target);
      const limit = sliderMode === "end" ? 1 : 0;
      const c = current != null ? pctOf(current) : limit;
      const showActive = sliderMode === "end" ? t <= c : sliderMode === "start" ? c <= t : false;
      const colored = sliderMode === "full" ? [0, 1] : sliderMode === "end" ? [t, 1] : [0, t];
      g += `<path class="arc arc-clear" d="${ARC}" ${dash(...colored)}/>`;
      g += `<path class="arc arc-colored" d="${ARC}" ${dash(...colored)}/>`;
      if (showActive) g += `<path class="arc arc-active" d="${ARC}" ${sliderMode === "end" ? dash(t, c) : dash(c, t)}/>`;
      if (current != null && current >= min && current <= max && (showActive || sliderMode === "full")) g += `<path class="cur on-arc" d="${ARC}" ${dot(c)}/>`;
      g += `<path class="tgt-border" d="${ARC}" ${dot(t)}/><path class="tgt" d="${ARC}" ${dot(t)}/>`;
    }
    const svg = `<svg viewBox="0 0 320 320"><g transform="translate(160 160) rotate(135)">${g}</g></svg>`;

    const label = action && action !== "off" && active ? (HVAC_ACTION[action] || cap(action)) : (HVAC_MODE[mode] || cap(mode));
    let big = "";
    if (target != null) {
      const s = num(target);
      const [int, dec] = s.split(".");
      big = `<p class="th-big"><span>${esc(int)}</span><span class="addon"><span class="dec">${dec ? "." + esc(dec) : ""}</span><span class="unit">${esc(unit)}</span></span></p>`;
    } else big = `<p class="th-big" style="font-size:36px">${esc(HVAC_MODE[mode] || cap(mode))}</p>`;
    const sec = current != null ? `<p class="th-sec">${ico("mdi:thermometer")}<span>${esc(num(current))} ${esc(unit)}</span></p>` : `<p class="th-sec"></p>`;

    const n = el("div", "ha-card thermo");
    n.style.setProperty("--state-color", stateColor);
    if (actionColor) n.style.setProperty("--action-color", actionColor);
    n.append(el("p", "th-title", esc(entityName(card, eid, st))));
    const cont = el("div", "th-container");
    const ctl = el("div", "th-control");
    const dial = el("div", "th-dial" + (active ? "" : " inactive"), svg + `<div class="th-info"><p class="th-label">${esc(label)}</p>${big}${sec}</div>`);
    if (target != null) {
      const btns = el("div", "th-buttons");
      const set = (d) => setState(eid, null, { temperature: Math.min(max, Math.max(min, Math.round((target + d) / step) * step)) });
      for (const [icon, d] of [["mdi:minus", -step], ["mdi:plus", step]]) {
        const b = el("div", "th-btn", ico(icon));
        b._tap = () => set(d);
        btns.append(b);
      }
      dial.append(btns);
    }
    ctl.append(dial);
    cont.append(ctl);
    n.append(cont);
    n.append(el("div", "th-more", ico("mdi:dots-vertical")));
    const feats = Array.isArray(card.features) ? card.features : [];
    if (feats.length) {
      const fw = el("div", "th-features");
      fw.style.setProperty("--feature-color", stateColor);
      feats.forEach((ft) => fw.append(climateFeature(ft, eid, st, f)));
      n.append(fw);
    }
    return n;
  }

  function climateFeature(ft, eid, st, f) {
    const a = st.attributes || {};
    if (ft.type === "climate-hvac-modes") {
      let modes = (a.hvac_modes || []).slice().sort((x, y) => HVAC_ORDER.indexOf(x) - HVAC_ORDER.indexOf(y)).reverse();
      if (Array.isArray(ft.hvac_modes) && ft.hvac_modes.length) modes = modes.filter((m) => ft.hvac_modes.includes(m));
      if (ft.style === "dropdown") return selectMenu("mdi:thermostat", "Mode", HVAC_MODE[st.state] || cap(st.state), modes, (m) => setState(eid, m));
      const row = el("div", "feat");
      const sel = el("div", "csel");
      for (const m of modes) {
        const o = el("div", "csel-opt" + (m === st.state ? " sel" : ""), ico(HVAC_ICONS[m] || "mdi:thermostat"));
        o.title = HVAC_MODE[m] || m;
        o._tap = () => setState(eid, m);
        sel.append(o);
      }
      row.append(sel);
      return row;
    }
    if (ft.type === "climate-preset-modes") {
      let presets = a.preset_modes || [];
      if (Array.isArray(ft.preset_modes) && ft.preset_modes.length) presets = presets.filter((m) => ft.preset_modes.includes(m));
      if (ft.style === "icons") {
        const row = el("div", "feat");
        const sel = el("div", "csel");
        for (const m of presets) {
          const o = el("div", "csel-opt" + (m === a.preset_mode ? " sel" : ""), `<span style="font-size:12px">${esc(cap(m))}</span>`);
          o._tap = () => setState(eid, null, { preset_mode: m });
          sel.append(o);
        }
        row.append(sel);
        return row;
      }
      return selectMenu("mdi:tune-variant", "Preset", a.preset_mode ? cap(a.preset_mode) : "None", presets, (m) => setState(eid, null, { preset_mode: m }), a.preset_mode);
    }
    return feature(ft, eid, st, f);
  }

  function selectMenu(icon, label, value, options, pick, currentValue) {
    const row = el("div", "feat");
    const m = el("div", "cmenu", `${ico(icon)}<div class="txt"><span class="lbl">${esc(label)}</span><span class="val">${esc(value)}</span></div>${ico("mdi:menu-down")}`);
    m._tap = () => {   // cycle through the options instead of opening a menu
      if (!options.length) return;
      const i = options.indexOf(currentValue);
      pick(options[(i + 1) % options.length]);
    };
    row.append(m);
    return row;
  }

  /* ---------- media-control ---------- */
  function mediaControlCard(card, f) {
    const eid = card.entity, st = states[eid];
    if (!st) return tileCard(card, f);
    const a = st.attributes || {};
    const s = st.state;
    const unavailable = s === "unavailable" || s === "unknown";
    const off = !unavailable && ["off", "standby"].includes(s);
    const sf = a.supported_features;
    const has = (bit) => sf == null || (Number(sf) & bit) !== 0;
    const controls = [];
    if (off) { if (sf == null || has(128)) controls.push(["turn_on", "mdi:power"]); }
    else if (!unavailable) {
      if (sf != null && has(256)) controls.push(["turn_off", "mdi:power"]);
      const playing = s === "playing";
      if ((playing || s === "paused") && has(16)) controls.push(["prev", "mdi:skip-previous"]);
      if (playing && (has(1) || has(4096))) controls.push(["pause", has(1) ? "mdi:pause" : "mdi:stop"]);
      else if (!playing && has(16384)) controls.push(["play", "mdi:play"]);
      if ((playing || s === "paused") && has(32)) controls.push(["next", "mdi:skip-next"]);
    }
    const title = a.media_title || "";
    const desc = [a.media_artist || a.media_album_artist, a.media_album_name && !a.media_artist ? a.media_album_name : null].filter(Boolean).join(" - ") ||
      a.media_series_title || a.app_name || "";
    const hasImage = !!(a.entity_picture || a.entity_picture_local);
    const progress = (s === "playing" || s === "paused") && a.media_duration != null && a.media_position != null;
    const hue = [...(title || eid)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

    const n = el("div", "ha-card mc" + (progress ? "" : " no-progress") + (hasImage ? "" : " no-image") + (controls.length ? "" : " no-controls") + (off || s === "idle" || s === "on" ? " keep-controls" : ""));
    const bgc = hasImage ? `hsl(${hue} 35% 22%)` : "var(--primary-color)";
    n.style.setProperty("--mc-bg", bgc);
    const bg = el("div", "mc-bg" + (off || unavailable ? " off" : ""));
    const color = el("div", "mc-color"); color.style.background = bgc;
    bg.append(color);
    if (!off && !unavailable) {
      const art = el("div", "mc-art" + (hasImage ? "" : " noimg"), ico("mdi:music"));
      art.style.background = hasImage
        ? `linear-gradient(135deg, hsl(${hue} 60% 55%), hsl(${(hue + 60) % 360} 55% 35%))`
        : `linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,0) 70%)`;
      bg.append(art);
      if (hasImage) bg.append(el("div", "mc-fade"));
    }
    n.append(bg);
    const pl = el("div", "mc-player");
    pl.append(el("div", "mc-top", ico(card.icon || a.icon || defaultIcon(eid, st)) + `<div>${esc(entityName(card, eid, st))}</div>`));
    pl.append(el("div", "mc-more", ico("mdi:dots-vertical")));
    if (!unavailable && (title || desc || controls.length)) {
      const wrap = el("div");
      const tc = el("div", "mc-tc");
      if (title || desc) tc.append(el("div", "mc-info", `<div class="mc-title">${esc(title || desc)}</div>${title ? esc(desc) : ""}`));
      if (controls.length) {
        const cw = el("div", "mc-controls");
        const start = el("div", "start");
        for (const [act, icon] of controls) {
          const b = el("div", "mc-btn" + (["play", "pause"].includes(act) ? " main" : ""), ico(icon));
          b._tap = () => {
            if (act === "play") setState(eid, "playing");
            else if (act === "pause") setState(eid, "paused");
            else if (act === "turn_on") setState(eid, "idle");
            else if (act === "turn_off") setState(eid, "off");
            else flash(b);
          };
          start.append(b);
        }
        const end = el("div", "end");
        if (sf != null && has(131072)) end.append(el("div", "mc-btn small", ico("mdi:play-box-multiple")));
        if (sf != null && has(524288)) end.append(el("div", "mc-btn small", ico("mdi:speaker-multiple")));
        cw.append(start, end);
        tc.append(cw);
      }
      wrap.append(tc);
      if (progress) {
        const p = el("div", "mc-progress");

  /* ---------- weather-forecast ---------- */
  function forecastData(st, type) {

    if (c === "clear-night") return "#5c6bc0";

  /* ---------- visibility conditions ---------- */

      }

    box.style.width = `${L.width}px`;
    box.style.columnGap = `${L.colGap}px`;
    box.style.rowGap = `${SECTION_GAP}px`;
    box.style.setProperty("--n", L.n);
    if (view.dense_section_placement) box.style.gridAutoFlow = "row dense";
    for (const sec of view.sections || []) {
      if (!isVisible(sec, f)) continue;
      const span = Math.max(1, Math.min(L.n, Number(sec.column_span) || 1));
      const s = el("div", "hv-section");
      s.style.gridColumn = `span ${span}`;
      if (sec.row_span) s.style.gridRow = `span ${sec.row_span}`;
      s.append(sectionGrid(sec.cards, BASE_COLS * span, f, false));
      s._span = span;
      box.append(s);
    }
    scr.append(box);

    const fs = footerSpec(view);
    if (fs) {
      const foot = el("div", "hv-footer");
      foot.style.left = `${L.pad}px`;
      foot.style.right = `${L.pad}px`;
      foot.style.top = `${H - FOOTER_TOP}px`;
      foot.style.height = `${FOOTER_TOP - FOOTER_BOTTOM}px`;
      const inner = el("div", "hv-footer-inner");
      inner.style.maxWidth = `${fs.maxw || 600}px`;
      if (fs.section) { const keep = ROW_H; ROW_H = ROW; inner.append(sectionGrid(fs.section, BASE_COLS, f, true)); ROW_H = keep; }
      else {
        const cell = el("div", "cell foot");
        cell.append(renderCard(fs.card, f, { natural: true }));
        inner.append(cell);
      }
      foot.append(inner);
      scr.append(foot);
    }
  }

  function measure(f) {
    const p = f.p, W = p.width, H = p.height, s = f.scale || 1;
    const sr = f.screen.getBoundingClientRect();
    const ftop = f.hasFooter === false ? H - NO_FOOTER_BOTTOM : H - BUDGET_BOTTOM;
    f.ftop = ftop;
    let maxBottom = TOP - GAP, over = 0, beyond = 0;
    f.screen.querySelectorAll(".ovl, .below").forEach((n) => n.remove());
    f.screen.querySelectorAll(".cell").forEach((c) => {
      if (c.parentElement && c.parentElement.closest(".cell")) return;
      const r = c.getBoundingClientRect();
      const top = (r.top - sr.top) / s;
      const left = (r.left - sr.left) / s;
      const bottom = Math.max((r.bottom - sr.top) / s, top + c.scrollHeight);
      const right = Math.max((r.right - sr.left) / s, left + c.scrollWidth);
      const foot = c.classList.contains("foot");
      const bad = bottom > (foot ? H : ftop) + 0.5 || right > W + 0.5 || left < -0.5;
      c.classList.toggle("over", bad);
      if (bad) over++;
      if (!foot) maxBottom = Math.max(maxBottom, bottom);
      beyond = Math.max(beyond, bottom - H);
    });
    f.maxBottom = maxBottom;
    const rowH = (f.budget && f.budget.px) || ROW;
    f.rowsUsed = Math.max(0, (maxBottom - TOP + GAP) / (rowH + GAP));
    f.rowsAvail = f.budget ? f.budget.rows : Math.max(0, Math.floor((ftop - TOP + GAP) / (ROW + GAP)));
    f.over = over;
    if (beyond > 0.5) f.screen.append(el("div", "below", `↓ ${Math.ceil(beyond)} px below the screen`));
    if (settings.grid) drawGrid(f, sr, s, ftop);
    caption(f);
  }

  function drawGrid(f, sr, s, ftop) {
    const p = f.p, H = p.height, L = f.layout;
    const box = f.screen.querySelector(".hv-sections");
    if (box && L) {
      const br = box.getBoundingClientRect();
      const bl = (br.left - sr.left) / s;
      const colW = (L.width - (L.n - 1) * L.colGap) / L.n;
      for (let i = 0; i < L.n; i++) {
        const o = el("div", "ovl ovl-col", i === 0 ? `<span>${L.n} HA column${L.n > 1 ? "s" : ""} · ${Math.round(colW)} px</span>` : "<span></span>");
        Object.assign(o.style, { left: `${bl + i * (colW + L.colGap)}px`, top: `${TOP}px`, width: `${colW}px`, height: `${Math.max(0, ftop - TOP)}px` });
        f.screen.append(o);
      }
      box.querySelectorAll(":scope > .hv-section").forEach((sec) => {
        const r = sec.getBoundingClientRect();
        const top = (r.top - sr.top) / s, left = (r.left - sr.left) / s, w = r.width / s;
        const h = Math.max(ROW_H, ftop - top);
        const o = el("div", "ovl ovl-sec");
        const cols = BASE_COLS * (sec._span || 1);
        o.style.setProperty("--cols", cols);
        Object.assign(o.style, { left: `${left}px`, top: `${top}px`, width: `${w}px`, height: `${h}px` });
        o.innerHTML = "<i></i>".repeat(cols);
        f.screen.append(o);
      });
    }
    const fo = el("div", "ovl ovl-foot", f.hasFooter === false ? `<span>no footer: bottom margin 12 px</span>` : `<span>footer band y = H−92 … H−12 · row ${Math.round(((f.budget && f.budget.px) || ROW) * 100) / 100} px</span>`);
    Object.assign(fo.style, { left: "0", right: "0", top: `${ftop}px`, height: `${Math.max(NO_FOOTER_BOTTOM, H - ftop - (f.hasFooter === false ? 0 : FOOTER_BOTTOM))}px` });
    f.screen.append(fo);
  }

  function caption(f) {
    const p = f.p;
    const views = (p.dashboard && p.dashboard.views) || [];
    const v = views[f.viewIdx] || {};
    const used = Math.round(f.rowsUsed * 100) / 100;
    const usedTxt = Number.isInteger(used) ? String(used) : used.toFixed(2).replace(/0$/, "");
    // Fractional rows come from the 24 px gap between stacked sections; only spilling past the footer top is an error.
    const tooMany = f.maxBottom > (f.ftop || f.p.height - BUDGET_BOTTOM) + 0.5;
    const L = f.layout;
    f.cap.innerHTML =
      `<div class="name">${esc(p.name)}${f.over ? '<span class="badge">overflow!</span>' : ""}</div>` +
      `<div>${p.width}×${p.height} CSS px · rows <span class="${tooMany ? "over-rows" : ""}">${usedTxt}/${f.rowsAvail}</span>` +
      (L ? ` · ${L.n}/${L.maxCols} cols` : "") +
      (f.budget ? ` · row ${Math.round(f.budget.px * 100) / 100} px` : "") +
      ` · ${esc(v.title || v.path || "view")} · ${Math.round((f.scale || 1) * 100)} %</div>`;
    summary();
  }

  /* ---------- frames ---------- */
  const stage = document.getElementById("stage");
  const selProfile = document.getElementById("sel-profile");
  const selPage = document.getElementById("sel-page");
  const selTheme = document.getElementById("sel-theme");
  const chkGrid = document.getElementById("chk-grid");
  const meta = document.getElementById("meta");
  let frames = [];

  function makeFrame(p) {
    const fig = el("figure", "dev");
    const box = el("div", "dev-box");
    const dev = el("div", "device");
    dev.style.width = `${p.width + 2 * BEZEL}px`;
    dev.style.height = `${p.height + 2 * BEZEL}px`;
    const screen = el("div", "screen");
    screen.style.left = `${BEZEL}px`;
    screen.style.top = `${BEZEL}px`;
    dev.append(screen);
    box.append(dev);
    const cap = el("figcaption");
    fig.append(box, cap);
    const views = (p.dashboard && p.dashboard.views) || [];
    let idx = views.findIndex((v) => v.path === settings.page);
    const f = { p, fig, box, dev, screen, cap, viewIdx: idx < 0 ? 0 : idx, scale: 1 };
    screen.addEventListener("click", (e) => {
      let t = e.target;
      while (t && t !== screen) {
        if (t._tap) { t._tap(e); return; }
        t = t.parentElement;
      }
    });
    return f;
  }

  function fit(f) {
    const avail = Math.max(120, stage.clientWidth - 32);
    const outer = f.p.width + 2 * BEZEL;
    const cap = settings.mode === "overview" ? OVERVIEW_SCALE : 1;
    f.scale = Math.min(cap, avail / outer);
    f.dev.style.transform = `scale(${f.scale})`;
    f.box.style.width = `${outer * f.scale}px`;
    f.box.style.height = `${(f.p.height + 2 * BEZEL) * f.scale}px`;
    f.fig.style.width = `${outer * f.scale}px`;
  }

  function renderFrame(f) {
    fit(f);
    renderView(f);
    measure(f);
  }

  function renderAll() {
    frames.forEach(renderFrame);
  }

  function navigate(f, path) {
    if (!path) return;
    const seg = String(path).replace(/[?#].*$/, "").split("/").filter(Boolean).pop() || "";
    const views = (f.p.dashboard && f.p.dashboard.views) || [];
    let i = views.findIndex((v) => v.path === seg);
    if (i < 0 && /^\d+$/.test(seg)) i = Number(seg);
    if (i < 0 || i >= views.length) return;
    f.viewIdx = i;
    if (settings.mode !== "overview") {
      settings.page = views[i].path || String(i);
      selPage.value = String(i);
    }
    renderFrame(f);
  }

  function summary() {
    const bad = frames.filter((f) => f.over).length;
    const src = DATA.source ? `${esc(DATA.source)} · built ${esc(DATA.built || "")}` : "";
    meta.innerHTML = `${src}${src ? " · " : ""}${frames.length} display${frames.length === 1 ? "" : "s"}` +
      (bad ? ` · <b>${bad} overflowing</b>` : " · no overflow") +
      " · tap tiles to toggle, tap the footer to switch pages";
  }

  function fillPages() {
    selPage.textContent = "";
    if (settings.mode === "overview") {
      const seen = new Map();
      DATA.profiles.forEach((p) => ((p.dashboard && p.dashboard.views) || []).forEach((v, i) => {
        const key = v.path || String(i);
        if (!seen.has(key)) seen.set(key, v.title || key);
      }));
      seen.forEach((title, key) => selPage.append(new Option(title, key)));
      selPage.value = seen.has(settings.page) ? settings.page : (seen.keys().next().value || "");
    } else {
      const f = frames[0];
      const views = (f && f.p.dashboard && f.p.dashboard.views) || [];
      views.forEach((v, i) => selPage.append(new Option(v.title || v.path || `View ${i + 1}`, String(i))));
      selPage.value = String(f ? f.viewIdx : 0);
    }
  }

  function build() {
    stage.textContent = "";
    const list = settings.mode === "overview" ? DATA.profiles : DATA.profiles.filter((p) => p.id === settings.mode);
    frames = list.map(makeFrame);
    if (!frames.length) stage.append(el("p", "empty", "No dashboards in this preview. Run build_preview.py after the goldens exist."));
    frames.forEach((f) => stage.append(f.fig));
    fillPages();
    renderAll();
  }

  selProfile.append(new Option("Overview: all displays (home)", "overview"));
  DATA.profiles.forEach((p) => selProfile.append(new Option(`${p.name} (${p.width}×${p.height})`, p.id)));
  selProfile.value = settings.mode;
  selTheme.value = settings.theme;
  chkGrid.checked = settings.grid;

  selProfile.addEventListener("change", () => { settings.mode = selProfile.value; build(); });
  selPage.addEventListener("change", () => {
    if (settings.mode === "overview") {
      settings.page = selPage.value;
      frames.forEach((f) => {
        const i = ((f.p.dashboard && f.p.dashboard.views) || []).findIndex((v, k) => (v.path || String(k)) === settings.page);
        f.viewIdx = i < 0 ? 0 : i;
      });
    } else if (frames[0]) frames[0].viewIdx = Number(selPage.value) || 0;
    renderAll();
  });
  selTheme.addEventListener("change", () => { settings.theme = selTheme.value; save(); renderAll(); });
  chkGrid.addEventListener("change", () => { settings.grid = chkGrid.checked; save(); renderAll(); });

  let rz = 0;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderAll, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => frames.forEach(measure)).catch(() => {});
  setInterval(() => {
    document.querySelectorAll(".clock-time").forEach((t) => { if (t._fmt) t.innerHTML = t._fmt(); });
  }, 15000);

  build();
})();
</script>

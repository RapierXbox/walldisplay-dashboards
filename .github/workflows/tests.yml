name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          # No requirements file: the pinned versions below live in this workflow.
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install test dependencies
        # 0.13.371 pins homeassistant==2026.10.0, the minimum version in hacs.json.
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component==0.13.371
      - name: Run tests
        run: pytest -q tests

[project]
name = "walldisplay-dashboards"
version = "0.1.0"
description = "Home Assistant integration that builds dashboards for wall displays"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
